<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Entry | Ganpati Aagman</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  .mode-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 20px; border-radius: 30px; font-weight: 700;
    font-size: 0.85rem; margin-bottom: 20px; border: 2px solid;
  }
  .mode-photo { background: #fff6df; color: #b77a11; border-color: #c38a21; }
  .mode-video { background: #f0f0ff; color: #5a3ec8; border-color: #7b61e8; }

  .upload-zone {
    border: 2px dashed #d3a54d; border-radius: 22px;
    padding: 40px 20px; text-align: center; background: #fffaf0;
    transition: all 0.3s;
  }
  .upload-zone.video-mode {
    border-color: #7b61e8; background: #f8f6ff;
  }
  .upload-zone.drag-over {
    border-color: #c38a21; background: #fff8e7; transform: scale(1.01);
  }
  .upload-zone.video-mode.drag-over {
    border-color: #5a3ec8; background: #eeebff;
  }
  .upload-icon { font-size: 3.5rem; margin-bottom: 10px; }
  .upload-zone h3 { margin: 8px 0 5px; font-size: 1.3rem; }
  .upload-zone p { color: #8a705c; font-size: 0.85rem; }
  .upload-zone.video-mode p { color: #6b56b8; }
  .file-info {
    display: none; align-items: center; gap: 10px;
    background: #e8f7e9; border: 1px solid #93d4a0; border-radius: 12px;
    padding: 12px 16px; margin-top: 16px; font-size: 0.85rem; color: #2a7a3a;
    font-weight: 600;
  }
  .file-info.show { display: flex; }
  .preview img, .preview video {
    max-width: 100%; max-height: 340px;
    border-radius: 15px; margin-top: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
  }
  .progress { height: 12px; border-radius: 20px; }
  .progress-bar { background: linear-gradient(90deg, #c68d1e, #e8a820); border-radius: 20px; transition: width 0.2s; }
  .progress-bar.video-bar { background: linear-gradient(90deg, #7b61e8, #a08aff); }
  .size-note { font-size: 0.75rem; color: #a08060; margin-top: 6px; }
</style>
</head>
<body class="form-page">
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" style="height:36px;width:auto;margin-right:8px;vertical-align:middle;border-radius:6px"> New alkapuri cha maharaja</a>
  </div>
</nav>

<main class="container form-wrap">
  <div class="form-card">
    <p class="eyebrow">STEP 02 / FINAL ENTRY</p>
    <h1>Upload Your <span>Creation</span></h1>
    <div class="success-mini">✓ Registration Successful</div>

    <!-- Participant Summary -->
    <div id="summary" class="summary"></div>

    <!-- Mode Badge — shows Photo or Video dynamically -->
    <div id="modeBadge" class="mode-badge mode-photo">📸 Photo Competition Mode</div>

    <!-- Upload Zone -->
    <div class="upload-zone" id="uploadZone">
      <div id="uploadIcon" class="upload-icon">📸</div>
      <h3 id="uploadTitle">Upload Your Photo</h3>
      <p id="uploadHint">JPG, JPEG, PNG or WEBP • Max 512 MB</p>
      <input id="media" type="file" class="form-control" accept="image/*" style="max-width:450px;margin:20px auto 0">
      <div id="fileInfo" class="file-info">✅ <span id="fileName"></span></div>
      <div id="preview" class="preview"></div>
    </div>
    <p class="size-note" id="sizeNote">📸 Photo: Max 512 MB — JPG, PNG, WEBP</p>

    <div id="uploadError" class="alert alert-danger d-none mt-3"></div>
    <button id="submitEntry" class="btn btn-gold btn-lg w-100 mt-4">SUBMIT MY ENTRY →</button>
    <div id="progress" class="progress mt-3 d-none">
      <div class="progress-bar" id="progressBar" style="width:0%">0%</div>
    </div>
  </div>
</main>

<script>
const data = JSON.parse(sessionStorage.getItem("ganpati_registration") || "null");
if (!data) {
  location.href = "{{ url_for('registration') }}";
} else {
  // Fill summary
  document.getElementById("summary").innerHTML = `
    <div><b>Participant</b><span>${data.name}</span></div>
    <div><b>Instagram</b><span>${data.instagram}</span></div>
    <div><b>Competition</b><span>${data.competition}</span></div>
    <div><b>Captured Using</b><span>${data.captured}</span></div>
    <div><b>Submission ID</b><span>${data.id}</span></div>`;

  const isVideo = data.competition === "Video";
  const input = document.getElementById("media");
  const zone = document.getElementById("uploadZone");
  const bar = document.getElementById("progressBar");

  // ── Switch UI based on competition type ──────────────────────────
  if (isVideo) {
    // Video Mode
    document.getElementById("modeBadge").className = "mode-badge mode-video";
    document.getElementById("modeBadge").innerHTML = "🎥 Video Competition Mode";
    document.getElementById("uploadIcon").textContent = "🎥";
    document.getElementById("uploadTitle").textContent = "Upload Your Video";
    document.getElementById("uploadHint").textContent = "MP4, MOV or WEBM • Max 1 GB";
    document.getElementById("sizeNote").textContent = "🎥 Video: Max 1 GB — MP4, MOV, WEBM";
    input.accept = "video/mp4,video/quicktime,video/webm";
    zone.classList.add("video-mode");
    bar.classList.add("video-bar");
  } else {
    // Photo Mode (default — already set in HTML)
    input.accept = "image/jpeg,image/png,image/webp";
  }

  // ── Preview on file select ────────────────────────────────────────
  input.addEventListener("change", () => {
    const f = input.files[0];
    const preview = document.getElementById("preview");
    const fileInfo = document.getElementById("fileInfo");
    preview.innerHTML = "";
    fileInfo.classList.remove("show");
    if (!f) return;

    const sizeStr = (f.size >= 1024 * 1024 * 1024)
      ? (f.size / (1024 * 1024 * 1024)).toFixed(2) + " GB"
      : (f.size / (1024 * 1024)).toFixed(2) + " MB";
    document.getElementById("fileName").textContent = f.name + " (" + sizeStr + ")";
    fileInfo.classList.add("show");

    const url = URL.createObjectURL(f);
    if (isVideo) {
      preview.innerHTML = `<video controls src="${url}" style="max-width:100%;max-height:320px;border-radius:15px;margin-top:20px"></video>`;
    } else {
      preview.innerHTML = `<img src="${url}" alt="Preview">`;
    }
  });

  // ── Drag & Drop ───────────────────────────────────────────────────
  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag-over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
  zone.addEventListener("drop", (e) => {
    e.preventDefault(); zone.classList.remove("drag-over");
    const f = e.dataTransfer.files[0];
    if (f) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event("change")); }
  });

  // ── Submit ────────────────────────────────────────────────────────
  document.getElementById("submitEntry").addEventListener("click", async () => {
    const f = input.files[0];
    const errEl = document.getElementById("uploadError");
    const progress = document.getElementById("progress");
    errEl.classList.add("d-none");

    if (!f) {
      errEl.textContent = `Please choose your ${isVideo ? "video" : "photo"} first.`;
      errEl.classList.remove("d-none"); return;
    }
    const maxBytes = isVideo ? (1024 * 1024 * 1024) : (512 * 1024 * 1024);
    const maxLabel = isVideo ? "1 GB" : "512 MB";
    if (f.size > maxBytes) {
      const userSizeStr = (f.size >= 1024 * 1024 * 1024)
        ? (f.size / (1024 * 1024 * 1024)).toFixed(2) + " GB"
        : (f.size / (1024 * 1024)).toFixed(1) + " MB";
      errEl.textContent = `File too large. Max allowed: ${maxLabel}. Your file: ${userSizeStr}`;
      errEl.classList.remove("d-none"); return;
    }

    document.getElementById("submitEntry").disabled = true;
    document.getElementById("submitEntry").textContent = "Uploading…";
    progress.classList.remove("d-none");

    // Fake progress animation (up to 80%)
    let n = 0;
    const fake = setInterval(() => {
      if (n < 80) { n += isVideo ? 2 : 5; bar.style.width = n + "%"; bar.textContent = n + "%"; }
    }, isVideo ? 300 : 150);

    try {
      const formData = new FormData();
      formData.append("id", data.id);
      formData.append("media", f);

      const res = await fetch("{{ url_for('api_submit') }}", { method: "POST", body: formData });
      const result = await res.json();
      clearInterval(fake);

      if (result.success) {
        bar.style.width = "100%"; bar.textContent = "100% ✓";
        const submission = { ...data, status: "submitted", mediaName: f.name, mediaType: f.type, submittedAt: new Date().toISOString() };
        sessionStorage.setItem("ganpati_submission", JSON.stringify(submission));
        setTimeout(() => { location.href = "{{ url_for('success') }}"; }, 600);
      } else {
        throw new Error(result.error || "Upload failed");
      }
    } catch (ex) {
      clearInterval(fake);
      progress.classList.add("d-none");
      errEl.textContent = "Upload error: " + ex.message;
      errEl.classList.remove("d-none");
      document.getElementById("submitEntry").disabled = false;
      document.getElementById("submitEntry").textContent = "SUBMIT MY ENTRY →";
    }
  });
}
</script>
</body>
</html>
