<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registration | Ganpati Aagman</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="form-page"><nav class="navbar navbar-expand-lg"><div class="container"><a class="navbar-brand" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" style="height:36px;width:auto;margin-right:8px;vertical-align:middle;border-radius:6px"> New alkapuri cha maharaja</a></div></nav>
<main class="container form-wrap"><div class="form-card"><p class="eyebrow">STEP 01 / REGISTRATION</p><h1>Join the <span>Competition</span></h1><p class="muted">Fill your details. After registration, you'll be taken directly to the upload page.</p>
<form id="registrationForm" novalidate>
<div class="row g-3">
<div class="col-md-6"><label>Participant Name *</label><input id="name" class="form-control" required placeholder="Enter your name"></div>
<div class="col-md-6"><label>Mobile Number *</label><input id="mobile" class="form-control" required inputmode="numeric" placeholder="10-digit mobile number"></div>
<div class="col-md-6"><label>Email *</label><input id="email" type="email" class="form-control" required placeholder="you@example.com"></div>
<div class="col-md-6"><label>Instagram ID *</label><input id="instagram" class="form-control" required placeholder="@yourusername"></div>
</div>
<hr><label class="mb-2">Competition Type *</label><div class="choice-grid mb-4">
<label class="choice"><input type="radio" name="competition" value="Photo" required><span>📸</span><strong>Photo Competition</strong><small>Capture Bappa's arrival</small></label>
<label class="choice"><input type="radio" name="competition" value="Video"><span>🎥</span><strong>Video Competition</strong><small>Tell the Aagman story</small></label>
</div>
<label class="mb-2">Captured Using *</label><div class="choice-grid">
<label class="choice compact"><input type="radio" name="captured" value="Mobile" required><span>📱</span><strong>Mobile</strong></label>
<label class="choice compact"><input type="radio" name="captured" value="Camera"><span>📷</span><strong>Camera</strong></label>
</div>
<div id="error" class="alert alert-danger d-none mt-4"></div>
<button class="btn btn-gold btn-lg w-100 mt-4" type="submit" id="submitBtn">CONTINUE TO UPLOAD →</button>
</form></div></main>
<script>
const form = document.getElementById("registrationForm");
const err = document.getElementById("error");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.classList.add("d-none");

  const name = document.getElementById("name").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const email = document.getElementById("email").value.trim();
  const instagram = document.getElementById("instagram").value.trim();
  const competition = document.querySelector('input[name="competition"]:checked')?.value;
  const captured = document.querySelector('input[name="captured"]:checked')?.value;

  if (!name || !/^\d{10}$/.test(mobile) || !email || !instagram || !competition || !captured) {
    err.textContent = "Please complete all fields correctly. Mobile number must be 10 digits.";
    err.classList.remove("d-none");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Registering…";

  const id = "GAC-" + Date.now().toString(36).toUpperCase();
  const data = { id, name, mobile, email, instagram, competition, captured };

  try {
    const res = await fetch("{{ url_for('api_register') }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (result.success) {
      // Save to sessionStorage so upload page can use it
      sessionStorage.setItem("ganpati_registration", JSON.stringify(data));
      location.href = "{{ url_for('upload') }}";
    } else {
      throw new Error(result.error || "Registration failed");
    }
  } catch (ex) {
    err.textContent = "Error: " + ex.message;
    err.classList.remove("d-none");
    submitBtn.disabled = false;
    submitBtn.textContent = "CONTINUE TO UPLOAD →";
  }
});
</script>
</body></html>
