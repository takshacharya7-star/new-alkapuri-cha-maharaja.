<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Admin Login | New alkapuri cha maharaja</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #4a1c10 0%, #200d07 45%, #0d0504 100%);
    font-family: 'Poppins', sans-serif;
    padding: 16px;
    color: #fff;
  }
  .login-card {
    background: rgba(36, 17, 8, 0.88);
    border: 1px solid rgba(226, 170, 43, 0.3);
    border-radius: 24px;
    padding: clamp(28px, 6vw, 44px) clamp(20px, 5vw, 36px);
    width: 100%;
    max-width: 420px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(240, 195, 91, 0.1) inset;
    text-align: center;
  }
  .logo-wrap {
    margin-bottom: 16px;
    display: inline-block;
  }
  .logo-img {
    width: 72px;
    height: 72px;
    object-fit: cover;
    border-radius: 18px;
    border: 2px solid rgba(226, 170, 43, 0.4);
    box-shadow: 0 8px 25px rgba(226, 170, 43, 0.25);
  }
  .om-badge {
    font-size: 1.1rem;
    color: #f0c35b;
    margin-bottom: 4px;
    letter-spacing: 2px;
  }
  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.3rem, 4.5vw, 1.65rem);
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
    line-height: 1.25;
  }
  h1 span {
    background: linear-gradient(135deg, #f0c35b, #e2aa2b);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    color: #cbb9a9;
    font-size: 0.82rem;
    margin-bottom: 26px;
  }
  label {
    display: block;
    color: #e2aa2b;
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
    text-align: left;
  }
  input[type=password] {
    width: 100%;
    padding: 13px 16px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(226, 170, 43, 0.3);
    border-radius: 12px;
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
  }
  input[type=password]:focus {
    border-color: #f0c35b;
    box-shadow: 0 0 0 3px rgba(240, 195, 91, 0.2);
    background: rgba(255, 255, 255, 0.09);
  }
  input[type=password]::placeholder {
    color: rgba(255, 255, 255, 0.35);
  }
  .btn-submit {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #f0c35b, #b77a11);
    border: none;
    border-radius: 50px;
    color: #211006;
    font-weight: 700;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    margin-top: 20px;
    letter-spacing: 0.04em;
    box-shadow: 0 8px 24px rgba(196, 137, 25, 0.3);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(196, 137, 25, 0.45);
  }
  .btn-submit:active {
    transform: translateY(0);
  }
  .error {
    background: rgba(255, 70, 70, 0.12);
    border: 1px solid rgba(255, 70, 70, 0.35);
    border-radius: 10px;
    color: #ff8e8e;
    padding: 10px 14px;
    font-size: 0.82rem;
    margin-top: 16px;
    text-align: center;
  }
  .back-link {
    display: inline-block;
    margin-top: 22px;
    color: #c7a87a;
    text-decoration: none;
    font-size: 0.8rem;
    transition: color 0.2s;
  }
  .back-link:hover {
    color: #f0c35b;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo-wrap">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-img">
  </div>
  <div class="om-badge">ॐ</div>
  <h1>Admin <span>Dashboard</span></h1>
  <p class="sub">New alkapuri cha maharaja — Ganpati Aagman</p>
  <form method="POST" action="{{ url_for('admin_login') }}">
    <label for="password">Security Password</label>
    <input type="password" id="password" name="password" placeholder="Enter admin password…" autofocus required>
    <button class="btn-submit" type="submit">LOGIN TO PANEL →</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
  <a href="{{ url_for('home') }}" class="back-link">← Back to Website</a>
</div>
</body>
</html>
