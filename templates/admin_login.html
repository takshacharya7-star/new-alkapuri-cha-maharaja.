<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Ganpati Aagman</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0f;
    background-image: radial-gradient(ellipse at 20% 50%, rgba(255,165,0,0.08) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 20%, rgba(255,100,0,0.06) 0%, transparent 50%);
    font-family: 'Poppins', sans-serif;
  }
  .login-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,165,0,0.2);
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    backdrop-filter: blur(20px);
    box-shadow: 0 32px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,165,0,0.05) inset;
  }
  .logo { font-size: 48px; text-align: center; margin-bottom: 8px; }
  h1 { color: #fff; font-size: 1.6rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
  .sub { color: rgba(255,255,255,0.4); font-size: 0.85rem; text-align: center; margin-bottom: 32px; }
  label { display: block; color: rgba(255,255,255,0.6); font-size: 0.8rem; font-weight: 500;
          letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  input[type=password] {
    width: 100%; padding: 14px 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,165,0,0.2);
    border-radius: 12px; color: #fff; font-size: 1rem; font-family: inherit;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type=password]:focus { border-color: #f5a623; box-shadow: 0 0 0 3px rgba(245,166,35,0.15); }
  .btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #f5a623, #e8821a);
    border: none; border-radius: 12px; color: #0a0a0f;
    font-weight: 700; font-size: 1rem; font-family: inherit;
    cursor: pointer; margin-top: 24px; letter-spacing: 0.04em;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .error {
    background: rgba(255,70,70,0.1); border: 1px solid rgba(255,70,70,0.3);
    border-radius: 10px; color: #ff6b6b; padding: 12px 16px;
    font-size: 0.85rem; margin-top: 16px; text-align: center;
  }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">🛡️</div>
  <h1>Admin Panel</h1>
  <p class="sub">New alkapuri cha maharaja</p>
  <form method="POST" action="{{ url_for('admin_login') }}">
    <label for="password">Admin Password</label>
    <input type="password" id="password" name="password" placeholder="Enter password…" autofocus required>
    <button class="btn" type="submit">LOGIN →</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</div>
</body>
</html>
