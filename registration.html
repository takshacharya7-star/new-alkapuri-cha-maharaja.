<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registration | Ganpati Aagman</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="form-page"><nav class="navbar navbar-expand-lg"><div class="container"><a class="navbar-brand" href="index.html"><span>ॐ</span> Ganpati Aagman</a></div></nav>
<main class="container form-wrap"><div class="form-card"><p class="eyebrow">STEP 01 / REGISTRATION</p><h1>Join the <span>Competition</span></h1><p class="muted">Fill your details. After registration, you'll be taken directly to the upload page.</p>
<form id="registrationForm" novalidate>
<div class="row g-3">
<div class="col-md-6"><label>Participant Name *</label><input id="name" class="form-control" required placeholder="Enter your name"></div>
<div class="col-md-6"><label>Mobile Number *</label><input id="mobile" class="form-control" required inputmode="numeric" placeholder="10-digit mobile number"></div>
<div class="col-md-6"><label>Email *</label><input id="email" type="email" class="form-control" required placeholder="you@example.com"></div>
<div class="col-md-6"><label>Instagram ID *</label><input id="instagram" class="form-control" required placeholder="@yourusername"></div>
</div>
<hr><label class="mb-2">Competition Type *</label><div class="choice-grid mb-4">
<label class="choice"><input type="radio" name="competition" value="Photo" required><span>📸</span><strong>Photo Competition</strong><small>Capture Bappa's arrival</small></label>
<label class="choice"><input type="radio" name="competition" value="Video"><span>🎥</span><strong>Video Competition</strong><small>Tell the Aagman story</small></label>
</div>
<label class="mb-2">Captured Using *</label><div class="choice-grid">
<label class="choice compact"><input type="radio" name="captured" value="Mobile" required><span>📱</span><strong>Mobile</strong></label>
<label class="choice compact"><input type="radio" name="captured" value="Camera"><span>📷</span><strong>Camera</strong></label>
</div>
<div id="error" class="alert alert-danger d-none mt-4"></div>
<button class="btn btn-gold btn-lg w-100 mt-4" type="submit">CONTINUE TO UPLOAD →</button>
</form></div></main>
<script src="js/registration.js"></script></body></html>
